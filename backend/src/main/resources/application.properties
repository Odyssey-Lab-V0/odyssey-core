micronaut.application.name=backend
micronaut.server.host=0.0.0.0
micronaut.server.port=8001
micronaut.server.cors.enabled=true
micronaut.server.cors.configurations.web.allowed-origins[0]=*
micronaut.server.cors.configurations.web.allowed-methods[0]=GET
micronaut.server.cors.configurations.web.allowed-methods[1]=POST
micronaut.server.cors.configurations.web.allowed-methods[2]=PATCH
micronaut.server.cors.configurations.web.allowed-methods[3]=PUT
micronaut.server.cors.configurations.web.allowed-methods[4]=DELETE
micronaut.server.cors.configurations.web.allowed-methods[5]=OPTIONS
micronaut.server.cors.configurations.web.allowed-headers[0]=*

datasources.default.url=jdbc:h2:file:${H2_FILE:./data/kindred};MODE=LEGACY;DB_CLOSE_ON_EXIT=FALSE
datasources.default.username=sa
datasources.default.password=
datasources.default.driver-class-name=org.h2.Driver
datasources.default.dialect=H2

jpa.default.properties.hibernate.hbm2ddl.auto=update
jpa.default.entity-scan.packages[0]=com.kindred.domain

micronaut.security.authentication=bearer
micronaut.security.token.jwt.signatures.secret.generator.secret=${JWT_SECRET:please-change-me-to-a-strong-secret-min-256-bits-long-please-now}
micronaut.security.token.jwt.signatures.secret.generator.jws-algorithm=HS256
micronaut.security.token.generator.access-token.expiration=7200
micronaut.security.intercept-url-map[0].pattern=/api/auth/**
micronaut.security.intercept-url-map[0].http-method=POST
micronaut.security.intercept-url-map[0].access[0]=isAnonymous()
micronaut.security.intercept-url-map[1].pattern=/api/health
micronaut.security.intercept-url-map[1].access[0]=isAnonymous()

# Seeded admin
app.admin.email=${ADMIN_EMAIL:admin@kindred.local}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
